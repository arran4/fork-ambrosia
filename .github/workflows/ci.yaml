name: CI/CD

on:
  push:
    branches: [main, master]
    tags: ['v*', 'v*.*.*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: build
        options: [build, release-major, release-minor, release-patch]

permissions:
  contents: write

jobs:
  build:
    name: Build Debian Package
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Debian Package in Docker
        run: |
          docker run --rm --platform linux/arm/v7 -v ${{ github.workspace }}:/workspace -w /workspace arm32v7/debian:jessie /bin/bash -c "\
            echo 'deb http://archive.debian.org/debian jessie main' > /etc/apt/sources.list && \
            echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid-until && \
            apt-get update && \
            apt-get install -y --force-yes build-essential devscripts equivs wget curl && \
            mk-build-deps -i -r -t 'apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y --force-yes' && \
            export CC=clang && export CXX=clang++ && export OBJC=clang && dpkg-buildpackage -us -uc -b && mv /*.deb /workspace/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: *.deb
          retention-days: 1

  publish-draft:
    name: Publish draft GitHub release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'release-'))
    runs-on: ubuntu-latest
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: dist-release

      - name: Publish draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist-release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
